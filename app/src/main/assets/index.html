<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes œufs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#FBF6EC;--card:#FFFFFF;--ink:#2B2118;--mut:#8A7B6A;--line:#EADFCB;--yolk:#E9A11A;--yolk2:#FFEBC0;--shell:#F4E9D8;--green:#2F7D4B;--red:#B9472F;}
@media (prefers-color-scheme:dark){:root{--bg:#1A1511;--card:#251E18;--ink:#F5EBDD;--mut:#A8977F;--line:#3A2F25;--yolk:#F5B53A;--yolk2:#4A3A1C;--shell:#2F271F;--green:#6CC08A;--red:#E27B63;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding:18px 16px 110px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:26px;margin:0;letter-spacing:-.3px}
h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:18px;margin:0 0 10px}
.status{font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.nav .lbl{font-weight:600;text-align:center;flex:1;text-transform:capitalize}
.nav .sub{display:block;font-size:12px;color:var(--mut);font-weight:500;text-transform:none}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.ib:disabled{opacity:.35}
.counter{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 4px}
.cbtn{width:64px;height:64px;border-radius:50%;border:none;font-size:32px;font-weight:600;cursor:pointer;background:var(--shell);color:var(--ink)}
.cbtn.plus{background:var(--yolk);color:#fff}
.egg{position:relative;width:130px;height:160px;display:flex;align-items:center;justify-content:center}
.egg svg{position:absolute;inset:0}
.egg input{position:relative;width:110px;text-align:center;font-family:Fraunces,serif;font-size:54px;font-weight:800;border:none;background:transparent;color:#2B2118;outline:none;-moz-appearance:textfield}
.egg input::-webkit-outer-spin-button,.egg input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.quick{display:flex;gap:8px;justify-content:center;margin:10px 0 2px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--yolk);border-color:var(--yolk);color:#fff}
.hint{text-align:center;font-size:13px;color:var(--mut);margin-top:6px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;font-weight:500}
.field input,.field textarea,.field select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.field textarea{resize:vertical;min-height:44px}
.full{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi .v{font-family:Fraunces,serif;font-size:26px;font-weight:800;line-height:1.1}
.kpi .k{font-size:12px;color:var(--mut);margin-top:2px}
.kpi .d{font-size:12px;font-weight:600;margin-top:4px}
.up{color:var(--green)}.down{color:var(--red)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;color:var(--mut);text-align:center;padding-bottom:2px}
.cal .c{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--mut);background:var(--bg);border:1px solid transparent;cursor:pointer;padding:0}
.cal .c b{font-size:15px;color:var(--ink)}
.cal .c.today{border-color:var(--yolk)}
.cal .c.fut{opacity:.35;cursor:default}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:none}
.row .m{color:var(--mut);font-size:13px}
.btn{display:block;width:100%;padding:13px;border-radius:14px;border:none;background:var(--yolk);color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:14px}
.x{border:none;background:none;color:var(--mut);font-size:18px;cursor:pointer;padding:0 4px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs div{display:flex;max-width:520px;width:100%}
.tab{flex:1;border:none;background:none;color:var(--mut);font:inherit;font-size:11px;font-weight:600;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab span{font-size:22px;filter:grayscale(1);opacity:.6}
.tab.on{color:var(--ink)}.tab.on span{filter:none;opacity:1}
svg text{font-family:Inter,sans-serif}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.banner{background:var(--yolk2);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.tip{font-size:13px;color:var(--mut);line-height:1.45}
textarea.out{width:100%;min-height:120px;font:12px ui-monospace,monospace;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;margin-top:10px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs"><div>
  <button class="tab" data-view="jour"><span>🥚</span>Jour</button>
  <button class="tab" data-view="mois"><span>📅</span>Mois</button>
  <button class="tab" data-view="annee"><span>📈</span>Année</button>
  <button class="tab" data-view="reglages"><span>⚙️</span>Réglages</button>
</div></nav>
<div class="toast" id="toast"></div>
<script>
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MOIS_C=['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(n,dec=0)=>Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const eur=n=>fmt(n,2)+' €';
const clone=o=>JSON.parse(JSON.stringify(o||{}));

const today=()=>ymd(new Date());
const S={months:{},settings:{poules:6,prix:0.40},sel:today(),view:'jour',vm:today().slice(0,7),vy:new Date().getFullYear(),online:'local',loading:true};

/* ---------- données ---------- */
function getMonth(k){const M=S.months[k]||(S.months[k]={});M.days=M.days||{};M.depenses=M.depenses||[];return M}
function rec(dateStr){const M=S.months[dateStr.slice(0,7)];return M&&M.days?M.days[dateStr.slice(8)]:null}
function setDay(dateStr,patch,rerender=true){
  const k=dateStr.slice(0,7),d=dateStr.slice(8),M=getMonth(k);
  const cur=Object.assign({r:0,c:0,v:0,note:''},M.days[d]||{},patch);
  ['r','c','v'].forEach(f=>{cur[f]=Math.max(0,Math.round(Number(cur[f])||0))});
  M.days[d]=cur;save('m-'+k,()=>S.months[k]);
  if(rerender)render();else renderLive();
}
function clearDay(dateStr){const k=dateStr.slice(0,7),M=getMonth(k);delete M.days[dateStr.slice(8)];save('m-'+k,()=>S.months[k]);render()}
function daysInMonth(k){const[y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()}
function monthStats(k){
  const M=S.months[k];const days=M&&M.days?M.days:{};let tot=0,c=0,v=0,n=0,best=null;
  for(const d in days){const x=days[d];tot+=x.r||0;c+=x.c||0;v+=x.v||0;n++;if(!best||x.r>best.r)best={d,r:x.r}}
  const dep=(M&&M.depenses||[]).reduce((a,x)=>a+(Number(x.m)||0),0);
  const avg=n?tot/n:0;const poules=Number(S.settings.poules)||0;
  return{tot,c,v,n,best,avg,taux:poules?avg/poules*100:0,dep,rev:v*(Number(S.settings.prix)||0)};
}
function prevMonthKey(k){const[y,m]=k.split('-').map(Number);const d=new Date(y,m-2,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function nextMonthKey(k){const[y,m]=k.split('-').map(Number);const d=new Date(y,m,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function rangeSum(endStr,n){let t=0,c=0;const e=parse(endStr);for(let i=0;i<n;i++){const d=new Date(e);d.setDate(e.getDate()-i);const x=rec(ymd(d));if(x){t+=x.r||0;c++}}return{t,c}}
function streak(){let n=0;const d=new Date();if(!rec(ymd(d)))d.setDate(d.getDate()-1);while(rec(ymd(d))){n++;d.setDate(d.getDate()-1)}return n}
function allTimeBest(){let b=null;for(const k in S.months){const days=S.months[k].days||{};for(const d in days){if(!b||days[d].r>b.r)b={date:k+'-'+d,r:days[d].r}}}return b}

/* ---------- stockage (cloud si dispo, sinon local) ---------- */
let backend={set:async(id,data)=>{try{localStorage.setItem('oeufs:'+id,JSON.stringify(data))}catch(e){}}};
const timers={},writing={},again={},dirty=new Set();
function save(id,get){dirty.add(id);clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id,get),500);setStatus('Enregistrement…')}
async function flush(id,get){
  if(writing[id]){again[id]=get;return}
  writing[id]=true;
  try{await backend.set(id,clone(get()));}catch(e){toast(e&&e.code==='quota_exceeded'?'Stockage plein':'Échec de l’enregistrement, réessaie')}
  writing[id]=false;
  if(again[id]){const g=again[id];delete again[id];return flush(id,g)}
  dirty.delete(id);if(!dirty.size)setStatus(S.online==='cloud'?'✓ Synchronisé':'✓ Enregistré sur cet appareil');
}
function loadLocal(){try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key.startsWith('oeufs:'))continue;const id=key.slice(6),v=JSON.parse(localStorage.getItem(key));apply(id,v)}}catch(e){}}
function apply(id,v){if(dirty.has(id))return;if(id==='reglages')S.settings=Object.assign({poules:6,prix:0.40},v);else if(id.startsWith('m-'))S.months[id.slice(2)]=clone(v)}

async function initCloud(){
  const use=window.claude&&window.claude.use;
  if(!use){S.loading=false;loadLocal();S.online='local';render();return}
  let db=null,user=null,uid=null;
  try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);uid=user?await user.id():null}catch(e){}
  if(!db||!uid){S.loading=false;loadLocal();S.online='local';render();return}
  const col=db.collection('data/users/'+uid);
  backend={set:(id,data)=>col.doc(id).set(data)};
  S.online='cloud';
  const t=setTimeout(()=>{if(S.loading){S.loading=false;setStatus('Données injoignables pour l’instant…');render()}},10000);
  col.onSnapshot(snap=>{
    snap.docs.forEach(doc=>{if(doc.exists)apply(doc.id,doc.data())});
    snap.docChanges().forEach(ch=>{if(ch.type==='removed'&&!dirty.has(ch.doc.id)&&ch.doc.id.startsWith('m-'))delete S.months[ch.doc.id.slice(2)]});
    if(!snap.metadata.fromCache){clearTimeout(t);if(!dirty.size)setStatus('✓ Synchronisé')}
    S.loading=false;
    const a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))renderLive();else render();
  },err=>{clearTimeout(t);S.loading=false;setStatus('Hors ligne');render()});
}

/* ---------- UI helpers ---------- */
function setStatus(s){S.status=s;const el=document.getElementById('status');if(el)el.textContent=s}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}
async function copy(text){if(window.AndroidApp){try{AndroidApp.copy(text);toast('Copié !');return true}catch(e){}}try{await navigator.clipboard.writeText(text);toast('Copié !');return true}catch(e){return false}}
const eggSvg=`<svg viewBox="0 0 130 160"><defs><radialGradient id="g" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#FFFDF7"/><stop offset="1" stop-color="#F1DEC0"/></radialGradient></defs><path d="M65 6C34 6 10 58 10 96c0 33 25 58 55 58s55-25 55-58C120 58 96 6 65 6z" fill="url(#g)" stroke="#E2CDA8" stroke-width="2"/></svg>`;

function barChart(vals,labels,{h=130,hl=-1,fmtTop=null}={}){
  const W=340,pb=18,pt=16,max=Math.max(1,...vals.map(v=>v||0));const n=vals.length,bw=W/n;
  let s=`<svg viewBox="0 0 ${W} ${h}" width="100%" role="img" aria-label="Graphique">`;
  vals.forEach((v,i)=>{const bh=v==null?0:(v/max)*(h-pb-pt);const x=i*bw+bw*.15,w=bw*.7;
    s+=`<rect x="${x}" y="${h-pb-bh}" width="${w}" height="${Math.max(bh,v==null?0:1.5)}" rx="${Math.min(4,w/3)}" fill="${i===hl?'var(--yolk)':'var(--yolk2)'}"><title>${labels[i]} : ${v??'—'}</title></rect>`;
    if(fmtTop&&v)s+=`<text x="${x+w/2}" y="${h-pb-bh-4}" font-size="10" text-anchor="middle" fill="var(--mut)">${v}</text>`;
    if(labels[i]!=='')s+=`<text x="${x+w/2}" y="${h-4}" font-size="10" text-anchor="middle" fill="var(--mut)">${labels[i]}</text>`});
  return s+'</svg>';
}

/* ---------- vues ---------- */
function vJour(){
  const d=S.sel,dt=parse(d),x=rec(d),isToday=d===today();
  const r=x?x.r:0;
  const w=rangeSum(d,7),ms=monthStats(d.slice(0,7));
  const last7=[],lab=[];for(let i=6;i>=0;i--){const t=new Date(dt);t.setDate(dt.getDate()-i);const y=rec(ymd(t));last7.push(y?y.r:null);lab.push(JOURS[t.getDay()].slice(0,1).toUpperCase())}
  const st=streak();
  return `
  <div class="nav"><button class="ib" data-act="day" data-n="-1">‹</button>
    <div class="lbl">${isToday?'Aujourd’hui':JOURS[dt.getDay()]+' '+dt.getDate()+' '+MOIS[dt.getMonth()]}<span class="sub">${isToday?JOURS[dt.getDay()]+' '+dt.getDate()+' '+MOIS[dt.getMonth()]:(x?'saisi':'pas encore saisi')}</span></div>
    <button class="ib" data-act="day" data-n="1" ${isToday?'disabled':''}>›</button></div>
  <div class="card">
    <div class="counter">
      <button class="cbtn" data-act="inc" data-n="-1" aria-label="Moins un">−</button>
      <div class="egg">${eggSvg}<input id="r" type="number" inputmode="numeric" min="0" value="${x?r:''}" placeholder="0" aria-label="Œufs récoltés"></div>
      <button class="cbtn plus" data-act="inc" data-n="1" aria-label="Plus un">+</button>
    </div>
    <div class="hint">${x?`<b>${r}</b> œuf${r>1?'s':''} récolté${r>1?'s':''}`:'Touche + ou tape le nombre'}${S.settings.poules?` · ${fmt(r/S.settings.poules*100)} % de ponte`:''}</div>
    <div class="quick">${[0,1,2,3,4,5,6].filter(n=>n<= (S.settings.poules||6)).slice(-6).map(n=>`<button class="chip ${x&&r===n?'on':''}" data-act="setr" data-n="${n}">${n}</button>`).join('')}</div>
  </div>
  <div class="card">
    <div class="fields">
      <div class="field"><label>Cassés / sales</label><input id="c" type="number" inputmode="numeric" min="0" value="${x&&x.c?x.c:''}" placeholder="0"></div>
      <div class="field"><label>Vendus / donnés</label><input id="v" type="number" inputmode="numeric" min="0" value="${x&&x.v?x.v:''}" placeholder="0"></div>
      <div class="field full"><label>Note (météo, mue, poule couveuse…)</label><textarea id="note" rows="1" placeholder="Optionnel">${esc(x?x.note:'')}</textarea></div>
    </div>
    ${x?`<button class="btn ghost small" style="margin-top:10px" data-act="clear">Effacer ce jour</button>`:''}
  </div>
  <div class="kpis" id="live">
    <div class="kpi"><div class="v">${fmt(w.t)}</div><div class="k">sur 7 jours</div></div>
    <div class="kpi"><div class="v">${fmt(ms.tot)}</div><div class="k">en ${MOIS[dt.getMonth()]}</div></div>
    <div class="kpi"><div class="v">${fmt(ms.avg,1)}</div><div class="k">moyenne / jour ce mois</div></div>
    <div class="kpi"><div class="v">${st} 🔥</div><div class="k">jours saisis d’affilée</div></div>
  </div>
  <div class="card" style="margin-top:12px"><h2>7 derniers jours</h2>${barChart(last7,lab,{h:110,hl:6,fmtTop:1})}</div>`;
}

function vMois(){
  const k=S.vm,[y,m]=k.split('-').map(Number),st=monthStats(k),pk=prevMonthKey(k),ps=monthStats(pk);
  const nd=daysInMonth(k),M=S.months[k]||{days:{},depenses:[]};const t=today();
  const vals=[],lab=[];for(let i=1;i<=nd;i++){const x=(M.days||{})[pad(i)];vals.push(x?x.r:null);lab.push(i===1||i%5===0?String(i):'')}
  const diff=ps.tot?((st.tot-ps.tot)/ps.tot*100):null;
  const first=(new Date(y,m-1,1).getDay()+6)%7;
  let cal='<div class="cal">'+['L','M','M','J','V','S','D'].map(h=>`<div class="h">${h}</div>`).join('');
  for(let i=0;i<first;i++)cal+='<div></div>';
  const max=Math.max(1,...vals.map(v=>v||0));
  for(let i=1;i<=nd;i++){const ds=k+'-'+pad(i),x=(M.days||{})[pad(i)],fut=ds>t;
    const a=x?.18+.82*(x.r/max):0;
    cal+=`<button class="c ${ds===t?'today':''} ${fut?'fut':''}" ${fut?'disabled':`data-act="goto" data-d="${ds}"`} style="${x?`background:color-mix(in srgb,var(--yolk) ${Math.round(a*100)}%,var(--bg))`:''}">${i}${x?`<b>${x.r}</b>`:''}</button>`}
  cal+='</div>';
  const nowK=t.slice(0,7);
  const coutOeuf=st.tot?st.dep/st.tot:0;
  return `
  <div class="nav"><button class="ib" data-act="month" data-n="-1">‹</button>
    <div class="lbl">${MOIS[m-1]} ${y}<span class="sub">${st.n} jour${st.n>1?'s':''} saisi${st.n>1?'s':''} sur ${k===nowK?Number(t.slice(8)):nd}</span></div>
    <button class="ib" data-act="month" data-n="1" ${k>=nowK?'disabled':''}>›</button></div>
  <div class="kpis">
    <div class="kpi"><div class="v">${fmt(st.tot)}</div><div class="k">œufs récoltés</div>${diff!=null?`<div class="d ${diff>=0?'up':'down'}">${diff>=0?'▲':'▼'} ${fmt(Math.abs(diff))} % vs ${MOIS_C[(m+10)%12]}</div>`:''}</div>
    <div class="kpi"><div class="v">${fmt(st.avg,1)}</div><div class="k">moyenne / jour</div></div>
    <div class="kpi"><div class="v">${fmt(st.taux)} %</div><div class="k">taux de ponte (${S.settings.poules} poules)</div></div>
    <div class="kpi"><div class="v">${st.best?st.best.r:'—'}</div><div class="k">${st.best?'record le '+Number(st.best.d)+' '+MOIS_C[m-1]:'meilleur jour'}</div></div>
  </div>
  <div class="card" style="margin-top:12px"><h2>Ponte jour par jour</h2>${barChart(vals,lab,{h:130})}</div>
  <div class="card"><h2>Calendrier</h2>${cal}<p class="tip" style="margin:8px 0 0">Touche un jour pour le modifier.</p></div>
  <div class="card"><h2>Bilan du mois</h2>
    <div class="row"><span>Œufs cassés / sales</span><b>${fmt(st.c)}</b></div>
    <div class="row"><span>Vendus / donnés</span><b>${fmt(st.v)}</b></div>
    <div class="row"><span>Œufs gardés pour toi</span><b>${fmt(Math.max(0,st.tot-st.c-st.v))}</b></div>
    <div class="row"><span>Recettes <span class="m">(${eur(S.settings.prix)}/œuf)</span></span><b>${eur(st.rev)}</b></div>
    <div class="row"><span>Dépenses</span><b>${eur(st.dep)}</b></div>
    <div class="row"><span>Coût de revient d’un œuf</span><b>${st.tot?eur(coutOeuf):'—'}</b></div>
    <div class="row"><span>Économie vs œufs du commerce <span class="m">(${eur(S.settings.prixMagasin??0.35)}/œuf)</span></span><b class="${(st.tot*(S.settings.prixMagasin??0.35)+0-st.dep)>=0?'up':'down'}">${eur(st.tot*(S.settings.prixMagasin??0.35)-st.dep)}</b></div>
  </div>
  <div class="card"><h2>Dépenses</h2>
    ${(M.depenses||[]).map((e,i)=>`<div class="row"><span>${esc(e.l)}</span><span><b>${eur(e.m)}</b> <button class="x" data-act="deldep" data-i="${i}" aria-label="Supprimer">×</button></span></div>`).join('')||'<p class="tip">Aucune dépense ce mois-ci.</p>'}
    <div class="fields" style="margin-top:10px">
      <div class="field"><label>Quoi</label><input id="depL" list="depList" placeholder="Aliment, paille…"><datalist id="depList"><option>Aliment / grain</option><option>Paille / copeaux</option><option>Coquilles / grit</option><option>Vétérinaire / vermifuge</option><option>Matériel</option></datalist></div>
      <div class="field"><label>Montant (€)</label><input id="depM" type="number" inputmode="decimal" step="0.01" placeholder="0,00"></div>
    </div>
    <button class="btn" style="margin-top:10px" data-act="adddep">Ajouter la dépense</button>
  </div>
  <button class="btn ghost" data-act="share">📋 Copier le récap du mois</button>
  <textarea class="out" id="shareOut" style="display:none" readonly></textarea>`;
}

function vAnnee(){
  const y=S.vy,vals=[],lab=[];let tot=0,dep=0,rev=0,n=0,best=null;
  for(let m=1;m<=12;m++){const k=y+'-'+pad(m),st=monthStats(k);vals.push(st.n?st.tot:null);lab.push(MOIS_C[m-1].slice(0,1).toUpperCase());tot+=st.tot;dep+=st.dep;rev+=st.rev;n+=st.n;if(st.n&&(!best||st.tot>best.tot))best={m,tot:st.tot}}
  const ab=allTimeBest();const cy=new Date().getFullYear();
  return `
  <div class="nav"><button class="ib" data-act="year" data-n="-1">‹</button><div class="lbl">${y}<span class="sub">${n} jours saisis</span></div><button class="ib" data-act="year" data-n="1" ${y>=cy?'disabled':''}>›</button></div>
  <div class="kpis">
    <div class="kpi"><div class="v">${fmt(tot)}</div><div class="k">œufs en ${y}</div></div>
    <div class="kpi"><div class="v">${n?fmt(tot/n,1):'—'}</div><div class="k">moyenne / jour</div></div>
    <div class="kpi"><div class="v" style="text-transform:capitalize">${best?MOIS_C[best.m-1]:'—'}</div><div class="k">meilleur mois${best?' ('+fmt(best.tot)+')':''}</div></div>
    <div class="kpi"><div class="v">${eur(rev-dep)}</div><div class="k">bilan (recettes − dépenses)</div></div>
  </div>
  <div class="card" style="margin-top:12px"><h2>Œufs par mois</h2>${barChart(vals,lab,{h:150,hl:y===cy?new Date().getMonth():-1,fmtTop:1})}</div>
  <div class="card"><h2>Détail</h2>${vals.map((v,i)=>v==null?'':`<button class="row" style="width:100%;background:none;border:none;border-bottom:1px solid var(--line);color:inherit;font:inherit;cursor:pointer" data-act="gomonth" data-k="${y}-${pad(i+1)}"><span style="text-transform:capitalize">${MOIS[i]}</span><b>${fmt(v)} ›</b></button>`).join('')||'<p class="tip">Pas encore de données cette année.</p>'}</div>
  ${ab?`<div class="card"><h2>🏆 Record absolu</h2><p class="tip" style="margin:0"><b style="color:var(--ink)">${ab.r} œufs</b> le ${parse(ab.date).getDate()} ${MOIS[parse(ab.date).getMonth()]} ${ab.date.slice(0,4)}</p></div>`:''}`;
}

function vReglages(){
  const s=S.settings;
  return `
  <h2 style="margin-bottom:12px">Réglages</h2>
  <div class="card"><div class="fields">
    <div class="field"><label>Nombre de poules pondeuses</label><input id="sPoules" type="number" inputmode="numeric" min="0" value="${s.poules??''}"></div>
    <div class="field"><label>Prix de vente d’un œuf (€)</label><input id="sPrix" type="number" inputmode="decimal" step="0.01" value="${s.prix??''}"></div>
    <div class="field full"><label>Prix d’un œuf en magasin (€) — pour calculer tes économies</label><input id="sMag" type="number" inputmode="decimal" step="0.01" value="${s.prixMagasin??0.35}"></div>
  </div><p class="tip" style="margin:10px 0 0">Le taux de ponte = œufs par jour ÷ nombre de poules. Une bonne pondeuse tourne autour de 70–90 % au printemps et baisse beaucoup en hiver et pendant la mue.</p></div>
  <div class="card"><h2>Exporter</h2><p class="tip" style="margin-top:0">Copie toutes tes données au format CSV (à coller dans Excel ou Google Sheets).</p><button class="btn ghost" data-act="csv">📋 Copier en CSV</button><textarea class="out" id="csvOut" style="display:none" readonly></textarea></div>
  <div class="card"><p class="tip" style="margin:0">${S.online==='cloud'?'☁️ Tes données sont enregistrées dans ton compte Claude : tu les retrouves sur ton téléphone comme sur ordinateur.':'📱 Tes données sont enregistrées sur ce téléphone. Pense à faire un export CSV de temps en temps pour les sauvegarder.'}</p></div>`;
}

function render(){
  const app=document.getElementById('app');
  const views={jour:vJour,mois:vMois,annee:vAnnee,reglages:vReglages};
  app.innerHTML=`<div class="top"><h1>🐔 Mes œufs</h1><span class="status" id="status">${esc(S.status||'')}</span></div>`+(S.loading?'<p class="tip">Chargement…</p>':'')+views[S.view]();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.view===S.view));
}
function renderLive(){ /* met à jour sans casser la saisie en cours */
  if(S.view!=='jour')return;const live=document.getElementById('live');if(!live)return;
  const tmp=document.createElement('div');tmp.innerHTML=vJour();const nl=tmp.querySelector('#live');if(nl)live.innerHTML=nl.innerHTML;
  const h=tmp.querySelector('.hint'),oh=document.querySelector('.hint');if(h&&oh)oh.innerHTML=h.innerHTML;
}

/* ---------- événements ---------- */
document.addEventListener('click',async e=>{
  const tab=e.target.closest('.tab');if(tab){S.view=tab.dataset.view;if(S.view==='mois')S.vm=S.sel.slice(0,7);render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,n=Number(b.dataset.n);
  if(a==='day'){const d=parse(S.sel);d.setDate(d.getDate()+n);const s=ymd(d);if(s<=today()){S.sel=s;render()}}
  else if(a==='inc'){const x=rec(S.sel);setDay(S.sel,{r:(x?x.r:0)+n});if(n>0&&navigator.vibrate)try{navigator.vibrate(10)}catch(_){}}
  else if(a==='setr'){setDay(S.sel,{r:n})}
  else if(a==='clear'){clearDay(S.sel);toast('Jour effacé')}
  else if(a==='month'){S.vm=n<0?prevMonthKey(S.vm):nextMonthKey(S.vm);render()}
  else if(a==='year'){S.vy+=n;render()}
  else if(a==='goto'){S.sel=b.dataset.d;S.view='jour';render();window.scrollTo(0,0)}
  else if(a==='gomonth'){S.vm=b.dataset.k;S.view='mois';render();window.scrollTo(0,0)}
  else if(a==='adddep'){const l=document.getElementById('depL').value.trim(),m=parseFloat(String(document.getElementById('depM').value).replace(',','.'));
    if(!l||!(m>0)){toast('Indique quoi et combien');return}
    const M=getMonth(S.vm);M.depenses.push({l,m:Math.round(m*100)/100});save('m-'+S.vm,()=>S.months[S.vm]);render();toast('Dépense ajoutée')}
  else if(a==='deldep'){const M=getMonth(S.vm);M.depenses.splice(Number(b.dataset.i),1);save('m-'+S.vm,()=>S.months[S.vm]);render()}
  else if(a==='share'){const k=S.vm,[y,m]=k.split('-').map(Number),st=monthStats(k);
    const txt=`🐔 Récap ${MOIS[m-1]} ${y}\n🥚 ${st.tot} œufs récoltés (${fmt(st.avg,1)}/jour)\n📊 Taux de ponte : ${fmt(st.taux)} % (${S.settings.poules} poules)\n🏆 Meilleur jour : ${st.best?st.best.r+' œufs le '+Number(st.best.d)+' '+MOIS[m-1]:'—'}\n💶 Vendus : ${st.v} (${eur(st.rev)}) · Dépenses : ${eur(st.dep)}`;
    if(!(await copy(txt))){const o=document.getElementById('shareOut');o.style.display='block';o.value=txt;o.select()}}
  else if(a==='csv'){let csv='date;recoltes;casses;vendus;note\n';Object.keys(S.months).sort().forEach(k=>{const days=S.months[k].days||{};Object.keys(days).sort().forEach(d=>{const x=days[d];csv+=`${k}-${d};${x.r||0};${x.c||0};${x.v||0};"${String(x.note||'').replace(/"/g,'""')}"\n`})});
    if(!(await copy(csv))){const o=document.getElementById('csvOut');o.style.display='block';o.value=csv;o.select()}}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='r'||id==='c'||id==='v'){if(e.target.value==='')return;setDay(S.sel,{[id]:e.target.value},false)}
  else if(id==='note'){setDay(S.sel,{note:e.target.value.slice(0,500)},false)}
  else if(id==='sPoules'||id==='sPrix'||id==='sMag'){const v=parseFloat(String(e.target.value).replace(',','.'));if(isNaN(v)||v<0)return;
    S.settings[{sPoules:'poules',sPrix:'prix',sMag:'prixMagasin'}[id]]=id==='sPoules'?Math.round(v):v;save('reglages',()=>S.settings)}
});
document.addEventListener('change',e=>{if(['r','c','v'].includes(e.target.id)){if(e.target.value==='')setDay(S.sel,{[e.target.id]:0});else render()}});
document.addEventListener('focusin',e=>{if(e.target.type==='number')setTimeout(()=>{try{e.target.select()}catch(_){}} ,0)});

render();
initCloud();
</script>
</body>
</html>
