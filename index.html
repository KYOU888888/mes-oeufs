<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes œufs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#FBF6EC;--card:#FFFFFF;--ink:#2B2118;--mut:#8A7B6A;--line:#EADFCB;--yolk:#E9A11A;--yolk2:#FFEBC0;--shell:#F4E9D8;--green:#2F7D4B;--red:#B9472F;}
@media (prefers-color-scheme:dark){:root{--bg:#1A1511;--card:#251E18;--ink:#F5EBDD;--mut:#A8977F;--line:#3A2F25;--yolk:#F5B53A;--yolk2:#4A3A1C;--shell:#2F271F;--green:#6CC08A;--red:#E27B63;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding:18px 16px 110px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:26px;margin:0;letter-spacing:-.3px}
h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:18px;margin:0 0 10px}
.status{font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.nav .lbl{font-weight:600;text-align:center;flex:1;text-transform:capitalize}
.nav .sub{display:block;font-size:12px;color:var(--mut);font-weight:500;text-transform:none}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.ib:disabled{opacity:.35}
.counter{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 4px}
.cbtn{width:64px;height:64px;border-radius:50%;border:none;font-size:32px;font-weight:600;cursor:pointer;background:var(--shell);color:var(--ink)}
.cbtn.plus{background:var(--yolk);color:#fff}
.egg{position:relative;width:130px;height:160px;display:flex;align-items:center;justify-content:center}
.egg svg{position:absolute;inset:0}
.egg input{position:relative;width:110px;text-align:center;font-family:Fraunces,serif;font-size:54px;font-weight:800;border:none;background:transparent;color:#2B2118;outline:none;-moz-appearance:textfield}
.egg input::-webkit-outer-spin-button,.egg input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.quick{display:flex;gap:8px;justify-content:center;margin:10px 0 2px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--yolk);border-color:var(--yolk);color:#fff}
.hint{text-align:center;font-size:13px;color:var(--mut);margin-top:6px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;font-weight:500}
.field input,.field textarea,.field select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.field textarea{resize:vertical;min-height:44px}
.full{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi .v{font-family:Fraunces,serif;font-size:26px;font-weight:800;line-height:1.1}
.kpi .k{font-size:12px;color:var(--mut);margin-top:2px}
.kpi .d{font-size:12px;font-weight:600;margin-top:4px}
.up{color:var(--green)}.down{color:var(--red)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;color:var(--mut);text-align:center;padding-bottom:2px}
.cal .c{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--mut);background:var(--bg);border:1px solid transparent;cursor:pointer;padding:0}
.cal .c b{font-size:15px;color:var(--ink)}
.cal .c.today{border-color:var(--yolk)}
.cal .c.fut{opacity:.35;cursor:default}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:none}
.row .m{color:var(--mut);font-size:13px}
.btn{display:block;width:100%;padding:13px;border-radius:14px;border:none;background:var(--yolk);color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:14px}
.x{border:none;background:none;color:var(--mut);font-size:18px;cursor:pointer;padding:0 4px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs div{display:flex;max-width:520px;width:100%}
.tab{flex:1;border:none;background:none;color:var(--mut);font:inherit;font-size:11px;font-weight:600;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab span{font-size:22px;filter:grayscale(1);opacity:.6}
.tab.on{color:var(--ink)}.tab.on span{filter:none;opacity:1}
svg text{font-family:Inter,sans-serif}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
.banner{background:var(--yolk2);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.tip{font-size:13px;color:var(--mut);line-height:1.45}
textarea.out{width:100%;min-height:120px;font:12px ui-monospace,monospace;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;margin-top:10px}

.top2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.k3{grid-template-columns:1fr 1fr 1fr}
.seg{display:flex;background:var(--shell);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.field .seg{margin-bottom:0}
.seg button{flex:1;border:none;background:none;color:var(--mut);font:inherit;font-weight:600;font-size:14px;padding:9px 4px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.acard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;color:var(--ink);font:inherit;cursor:pointer}
.acard.gone{opacity:.65}
.ph{width:58px;height:58px;border-radius:50%;overflow:hidden;flex:none;background:var(--shell);display:flex;align-items:center;justify-content:center;font-size:30px}
.ph img{width:100%;height:100%;object-fit:cover}
.ai{flex:1;min-width:0}.an{font-weight:700;font-size:16px}
.m{color:var(--mut);font-size:13px}
.badge{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--shell);color:var(--mut)}
.badge.red{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.badge.yel{background:var(--yolk2);color:var(--ink)}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));z-index:21;max-width:520px;margin:0 auto}
.phbig{display:flex;margin:4px auto 12px;width:120px;height:120px;border-radius:50%;overflow:hidden;background:var(--shell);align-items:center;justify-content:center;cursor:pointer;border:2px dashed var(--line)}
.phbig img{width:100%;height:100%;object-fit:cover}
.phbig span{font-size:44px;display:flex;flex-direction:column;align-items:center}.phbig small{font-size:11px;color:var(--mut);font-weight:600}
.agebox{background:var(--yolk2);border-radius:12px;padding:10px 12px;font-size:14px}
.tl{display:flex;flex-direction:column;gap:8px}
.tli{display:flex;gap:10px;align-items:flex-start;font-size:14px}.tli>span{width:22px;text-align:center}
.tli.done{opacity:.55}
.prog{height:10px;background:var(--shell);border-radius:99px;overflow:hidden}.prog div{height:100%;background:var(--yolk);border-radius:99px}
.nextm{background:var(--yolk2);border-radius:12px;padding:9px 12px;font-size:14px;margin:10px 0}
.rowbtn{width:100%;background:none;border:none;border-bottom:1px solid var(--line);color:inherit;font:inherit;cursor:pointer}
select{appearance:auto}
.btn:disabled{opacity:.6}
.tipcard{background:var(--yolk2);border-color:transparent}
.duecard{border-color:var(--yolk);border-width:2px}
.sw{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer}.sw input{width:22px;height:22px;accent-color:var(--yolk)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs"><div>
  <button class="tab" data-view="jour"><span>🥚</span>Jour</button>
  <button class="tab" data-view="stats"><span>📊</span>Stats</button>
  <button class="tab" data-view="basse"><span>🐔</span>Basse-cour</button>
  <button class="tab" data-view="couvee"><span>🐣</span>Couvée</button>
  <button class="tab" data-view="reglages"><span>⚙️</span>Réglages</button>
</div></nav>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script>
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MOIS_C=['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const dLong=s=>{const d=parse(s);return d.getDate()+' '+MOIS[d.getMonth()]+' '+d.getFullYear()};
const dShort=s=>{const d=parse(s);return JOURS[d.getDay()].slice(0,3)+'. '+d.getDate()+' '+MOIS_C[d.getMonth()]};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(n,dec=0)=>Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const eur=n=>fmt(n,2)+' €';
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>ymd(new Date());
const S={months:{},animals:{},couvees:{list:[]},soins:{list:[]},settings:{poules:6,prix:0.40},sel:today(),view:'jour',statsMode:'mois',vm:today().slice(0,7),vy:new Date().getFullYear(),online:'local',loading:true,flockFilter:'vivants',edit:null};

/* ---------- basse-cour ---------- */
const TYPES={poule:{n:'Poule',e:'🐔'},coq:{n:'Coq',e:'🐓'},poussin:{n:'Poussin',e:'🐣'}};
function flock(){return Object.values(S.animals).filter(a=>a&&!a.del)}
function arrDate(a){return a.arrivee||a.naiss||'0000-01-01'}
function aliveOn(a,ds){return arrDate(a)<=ds&&(a.statut==='vivant'||!a.fin||a.fin>ds)}
function hensOn(ds){const f=flock();if(!f.length)return Number(S.settings.poules)||0;return f.filter(a=>a.type==='poule'&&aliveOn(a,ds)).length}
function birth(a){if(a.naiss)return a.naiss;if(a.arrivee&&a.ageArr!=null&&a.ageArr!=='')return addDays(a.arrivee,-Math.round(Number(a.ageArr)*7));return null}
function ageStr(b,ref){if(!b)return'âge inconnu';const d=diffDays(b,ref||today());if(d<0)return'pas encore né';if(d<14)return d+' jour'+(d>1?'s':'');if(d<182)return Math.floor(d/7)+' semaines';
  const m=Math.floor(d/30.44);if(m<24)return m+' mois';const y=Math.floor(m/12),r=m%12;return y+' an'+(y>1?'s':'')+(r?' '+r+' mois':'')}
function ageWeeks(a){const b=birth(a);return b?diffDays(b,today())/7:null}
function animalBadge(a){
  if(a.statut==='mort')return`<span class="badge red">✝ morte${a.type==='coq'?'':''} ${a.fin?'le '+dShort(a.fin):''}</span>`;
  if(a.statut==='parti')return`<span class="badge">vendu·e / donné·e</span>`;
  const w=ageWeeks(a);if(w==null)return'';
  if(a.type==='poule'&&w<20)return`<span class="badge">pas encore en ponte</span>`;
  if(a.type==='poule'&&w>=20&&w<26)return`<span class="badge yel">début de ponte</span>`;
  if(a.type==='poule'&&w>156)return`<span class="badge">ponte en baisse (+3 ans)</span>`;
  if(a.type==='poussin'&&w>=8)return`<span class="badge yel">à passer en poule/coq ?</span>`;
  return'';
}
function readPhoto(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const m=480,sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function saveAnimal(a){S.animals[a.id]=a;save('a-'+a.id)}

/* ---------- couvées ---------- */
const ESP={poule:{n:'Poule',d:21},naine:{n:'Poule naine',d:20},cane:{n:'Cane',d:28},barbarie:{n:'Cane de Barbarie',d:35},oie:{n:'Oie',d:30},dinde:{n:'Dinde',d:28},pintade:{n:'Pintade',d:27},caille:{n:'Caille',d:17},faisan:{n:'Faisan',d:24}};
function milestones(esp,debut,meth){const D=ESP[esp].d;const m=[
  {j:0,t:'Mise en couvaison',i:'🥚'},
  {j:Math.round(D/3),t:'1er mirage : retirer les œufs clairs',i:'🔦'},
  {j:Math.round(D*2/3),t:'2e mirage : retirer les œufs arrêtés',i:'🔦'},
  {j:D-3,t:meth==='couveuse'?'Arrêter le retournement, monter l’humidité':'Ne plus déranger la couveuse',i:'🤫'},
  {j:D,t:'Éclosion prévue (± 1 jour)',i:'🐣'}];
  return m.map(x=>({...x,date:addDays(debut,x.j)}))}
function saveCouvees(){save('couvees');syncCouveeAlerts()}
function couveeAlertsOn(){return S.settings.alertesCouvee!==false}
function syncCouveeAlerts(){
  if(!(window.AndroidApp&&AndroidApp.setCouveeAlerts))return;
  const out=[];
  if(couveeAlertsOn())(S.couvees.list||[]).filter(c=>!c.fini).forEach(c=>{const E=ESP[c.esp];if(!E)return;
    milestones(c.esp,c.debut,c.meth).filter(m=>m.j>0).forEach(m=>{const[y,mo,d]=m.date.split('-').map(Number);const t=new Date(y,mo-1,d,9,0,0).getTime();
      if(t>Date.now())out.push({t,title:`🐣 Couvée ${E.n.toLowerCase()} · jour ${m.j}`,text:m.j===E.d?`Éclosion prévue aujourd’hui (${c.n} œufs) ! Ne pas ouvrir, prévoir chaleur, eau et aliment poussin.`:m.t})})});
  out.sort((a,b)=>a.t-b.t);
  try{AndroidApp.setCouveeAlerts(JSON.stringify(out.slice(0,40)))}catch(e){}
}

/* ---------- soins & entretien ---------- */
const SOINS_CONSEILLES=[['🧹','Nettoyer le poulailler / changer la litière',14],['💧','Nettoyer abreuvoir et mangeoire',7],['🐜','Traitement poux rouges / parasites',30],['💊','Vermifuge',90],['🔒','Vérifier grillage et fermetures',30]];
function soinsList(){return(S.soins.list||[]).map(x=>{const next=x.last?addDays(x.last,Number(x.every)||1):null;return{...x,next,late:next?diffDays(next,today()):null}}).sort((a,b)=>(a.next||'0').localeCompare(b.next||'0'))}
function soinsDue(){return soinsList().filter(x=>x.late!=null&&x.late>=0)}
function soinWhen(x){return x.late==null?'touche ✓ quand c’est fait':x.late>0?`<span class="down">en retard de ${x.late} j</span>`:x.late===0?'<b>aujourd’hui</b>':x.late>=-3?`dans ${-x.late} j`:dShort(x.next)}
function soinDone(id){const x=(S.soins.list||[]).find(x=>x.id===id);if(!x)return;x.last=today();x.hist=[today(),...(x.hist||[])].slice(0,20);save('soins');toast('✓ '+x.nom);render()}

/* ---------- conseils du mois ---------- */
const CONSEILS=[
 'Jours courts = ponte faible, c’est normal. Vérifie que l’eau ne gèle pas et donne un peu de maïs le soir pour l’énergie.',
 'La ponte repart doucement avec les jours qui rallongent. Bon moment pour un vermifuge avant le printemps.',
 'La ponte remonte fort : laisse des coquilles d’huîtres (ou de leurs propres œufs, séchées et broyées) à volonté pour le calcium.',
 'C’est la meilleure saison pour faire couver : poussins nés au printemps = pondeuses dès l’automne.',
 'Avec la chaleur, les poux rouges arrivent : inspecte les perchoirs le soir avec une lampe.',
 'Ombre et eau fraîche en permanence. Ramasse les œufs tous les jours, ils s’abîment vite au chaud.',
 'Canicule : change l’eau plusieurs fois par jour, une baisse de ponte est normale quand il fait très chaud.',
 'Pic des poux rouges : traite le poulailler (terre de diatomée, nettoyage des fentes et des perchoirs).',
 'Début de la mue pour beaucoup de poules : plumes partout et ponte en baisse, c’est normal.',
 'Pendant la mue, donne plus de protéines (vers de farine, graines de tournesol). Pense au vermifuge d’automne.',
 'Ponte au plus bas de l’année : c’est normal. Vérifie l’étanchéité du poulailler avant l’hiver.',
 'Litière bien sèche, eau non gelée, et ferme le poulailler chaque soir : le renard a faim en hiver.'];

/* ---------- œufs ---------- */
function getMonth(k){const M=S.months[k]||(S.months[k]={});M.days=M.days||{};M.depenses=M.depenses||[];return M}
function rec(dateStr){const M=S.months[dateStr.slice(0,7)];return M&&M.days?M.days[dateStr.slice(8)]:null}
function setDay(dateStr,patch,rerender=true){
  const k=dateStr.slice(0,7),d=dateStr.slice(8),M=getMonth(k);
  const cur=Object.assign({r:0,c:0,v:0,note:''},M.days[d]||{},patch);
  ['r','c','v'].forEach(f=>{cur[f]=Math.max(0,Math.round(Number(cur[f])||0))});
  M.days[d]=cur;save('m-'+k);
  if(rerender)render();else renderLive();
}
function clearDay(dateStr){const k=dateStr.slice(0,7),M=getMonth(k);delete M.days[dateStr.slice(8)];save('m-'+k);render()}
function addDepense(dateStr,l,m){const k=dateStr.slice(0,7),M=getMonth(k);M.depenses.push({l,m:Math.round(m*100)/100});save('m-'+k)}
function daysInMonth(k){const[y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()}
function monthStats(k){
  const M=S.months[k];const days=M&&M.days?M.days:{};let tot=0,c=0,v=0,n=0,best=null,hs=0;
  for(const d in days){const x=days[d];tot+=x.r||0;c+=x.c||0;v+=x.v||0;n++;hs+=hensOn(k+'-'+d);if(!best||x.r>best.r)best={d,r:x.r}}
  const dep=(M&&M.depenses||[]).reduce((a,x)=>a+(Number(x.m)||0),0);
  const avg=n?tot/n:0;
  return{tot,c,v,n,best,avg,poules:n?hs/n:hensOn(k+'-15'),taux:hs?tot/hs*100:0,dep,rev:v*(Number(S.settings.prix)||0)};
}
function prevMonthKey(k){const[y,m]=k.split('-').map(Number);const d=new Date(y,m-2,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function nextMonthKey(k){const[y,m]=k.split('-').map(Number);const d=new Date(y,m,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function rangeSum(endStr,n){let t=0,c=0;for(let i=0;i<n;i++){const x=rec(addDays(endStr,-i));if(x){t+=x.r||0;c++}}return{t,c}}
function streak(){let n=0;let d=today();if(!rec(d))d=addDays(d,-1);while(rec(d)){n++;d=addDays(d,-1)}return n}
function allTimeBest(){let b=null;for(const k in S.months){const days=S.months[k].days||{};for(const d in days){if(!b||days[d].r>b.r)b={date:k+'-'+d,r:days[d].r}}}return b}

/* ---------- stockage : téléphone + compte en ligne (Supabase) ---------- */
const CFG=window.OEUFS_CONFIG||{};
const SB=String(CFG.supabaseUrl||'').trim().replace(/\/+$/,''),KEY=String(CFG.supabaseKey||'').trim();
const CLOUD_OK=!!(SB&&KEY);
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let session=LS.get('oeufs-session');
let pending=new Set(LS.get('oeufs-pending')||[]);
const savePending=()=>LS.set('oeufs-pending',[...pending]);
let pushTimer=null,pushing=false,pushAgain=false;
function docData(id){if(id==='reglages')return S.settings;if(id==='couvees')return S.couvees;if(id==='soins')return S.soins;if(id.startsWith('a-'))return S.animals[id.slice(2)];return S.months[id.slice(2)]}
function save(id){
  const d=docData(id);if(!d)return;d._t=Date.now();LS.set('oeufs:'+id,d);
  pending.add(id);savePending();
  clearTimeout(pushTimer);pushTimer=setTimeout(pushAll,800);
  setStatus(session?'Synchronisation…':'✓ Enregistré');
}
function apply(id,v){if(!v)return;if(id==='reglages')S.settings=Object.assign({poules:6,prix:0.40},v);else if(id==='couvees'){S.couvees=clone(v);S.couvees.list=S.couvees.list||[]}else if(id==='soins'){S.soins=clone(v);S.soins.list=S.soins.list||[]}else if(id.startsWith('a-'))S.animals[id.slice(2)]=clone(v);else if(id.startsWith('m-'))S.months[id.slice(2)]=clone(v)}
function loadLocal(){try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key.startsWith('oeufs:'))continue;apply(key.slice(6),JSON.parse(localStorage.getItem(key)))}}catch(e){}}

async function rawAuth(path,body){
  const r=await fetch(SB+path,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>null);
  if(!r.ok){const e=new Error(frErr((j&&(j.msg||j.message||j.error_description||j.error))||('Erreur '+r.status)));e.status=r.status;throw e}
  return j;
}
function frErr(m){m=String(m);
  if(/invalid login|invalid_credentials/i.test(m))return'E-mail ou mot de passe incorrect';
  if(/already registered|already exists/i.test(m))return'Ce compte existe déjà : connecte-toi';
  if(/email not confirmed/i.test(m))return'Confirme d’abord ton e-mail (lien reçu par mail)';
  if(/password.*(6|short|weak)/i.test(m))return'Mot de passe trop court (6 caractères minimum)';
  if(/rate limit/i.test(m))return'Trop d’essais, patiente une minute';
  return m}
function setSession(j,email){session={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000,uid:(j.user&&j.user.id)||(session&&session.uid),email:email||(j.user&&j.user.email)||(session&&session.email)};LS.set('oeufs-session',session)}
async function ensureFresh(){
  if(!session)throw new Error('Non connecté');
  if(Date.now()<session.expires_at-60000)return;
  try{setSession(await rawAuth('/auth/v1/token?grant_type=refresh_token',{refresh_token:session.refresh_token}))}
  catch(e){if(e.status>=400&&e.status<500){logout();throw new Error('Session expirée, reconnecte-toi')}throw e}
}
async function api(path,opt={}){
  await ensureFresh();
  const r=await fetch(SB+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',...(opt.headers||{})}});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw new Error((j&&(j.message||j.msg))||('Erreur serveur '+r.status));
  return j;
}
async function pushAll(){
  if(!session||!CLOUD_OK)return;
  if(pushing){pushAgain=true;return}
  pushing=true;
  try{
    const ids=[...pending];
    const rows=ids.map(id=>({user_id:session.uid,id,data:docData(id),updated_at:new Date().toISOString()})).filter(r=>r.data);
    if(rows.length)await api('/rest/v1/docs?on_conflict=user_id,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});
    ids.forEach(id=>pending.delete(id));savePending();
    setStatus('☁️ Synchronisé');
  }catch(e){setStatus(navigator.onLine===false?'Hors ligne : synchro plus tard':'Synchro en attente');}
  pushing=false;
  if(pushAgain){pushAgain=false;pushAll()}
}
async function syncAll(){
  if(!session||!CLOUD_OK)return;
  setStatus('Synchronisation…');
  try{
    const rows=await api('/rest/v1/docs?select=id,data')||[];
    const seen=new Set();
    rows.forEach(r=>{seen.add(r.id);const loc=docData(r.id);const ct=(r.data&&r.data._t)||0,lt=(loc&&loc._t)||0;
      if(!loc||ct>lt){if(!pending.has(r.id)||ct>lt){apply(r.id,r.data);LS.set('oeufs:'+r.id,r.data);pending.delete(r.id)}}
      else if(lt>ct)pending.add(r.id)});
    if(!seen.has('reglages')&&S.settings._t)pending.add('reglages');
    Object.keys(S.months).forEach(k=>{if(!seen.has('m-'+k))pending.add('m-'+k)});Object.keys(S.animals).forEach(k=>{if(!seen.has('a-'+k))pending.add('a-'+k)});if(!seen.has('couvees')&&S.couvees._t)pending.add('couvees');if(!seen.has('soins')&&S.soins._t)pending.add('soins');
    savePending();syncCouveeAlerts();
    const a=document.activeElement;if(!S.edit&&!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')))render();
    await pushAll();
  }catch(e){setStatus(e.message==='Session expirée, reconnecte-toi'?e.message:'Hors ligne : synchro plus tard');render()}
}
async function login(email,pw,create){
  if(!email||!pw){toast('Indique ton e-mail et un mot de passe');return}
  S.authBusy=true;S.authMsg='';render();
  try{
    if(create){
      const j=await rawAuth('/auth/v1/signup',{email,password:pw});
      if(j&&j.access_token)setSession(j,email);
      else{S.authMsg='Compte créé ! Clique sur le lien reçu par e-mail, puis reviens te connecter.';S.authBusy=false;render();return}
    }else setSession(await rawAuth('/auth/v1/token?grant_type=password',{email,password:pw}),email);
    S.authBusy=false;toast('Connecté ✓');await syncAll();
  }catch(e){S.authBusy=false;S.authMsg=e.message||'Connexion impossible';render()}
}
function logout(){session=null;LS.del('oeufs-session');setStatus('✓ Enregistré sur le téléphone');render()}
function startSync(){
  S.loading=false;loadLocal();S.online=session?'cloud':'local';render();
  if(session)syncAll();
  window.addEventListener('online',()=>{if(session)pushAll()});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&session)syncAll()});
}
function accountCard(){
  if(!CLOUD_OK)return `<div class="card"><h2>☁️ Compte en ligne</h2><p class="tip" style="margin:0">Pas encore configuré : renseigne le fichier <b>config.js</b> (voir le guide).</p></div>`;
  if(session)return `<div class="card"><h2>☁️ Compte en ligne</h2>
    <div class="row"><span>Connecté</span><b style="font-size:14px">${esc(session.email||'')}</b></div>
    <p class="tip">Tes œufs sont sauvegardés en ligne. Connecte-toi avec le même compte sur un autre téléphone pour tout retrouver.</p>
    <div style="display:flex;gap:8px"><button class="btn small" data-act="syncnow">🔄 Synchroniser</button><button class="btn ghost small" data-act="logout">Se déconnecter</button></div></div>`;
  return `<div class="card"><h2>☁️ Compte en ligne</h2>
    <p class="tip" style="margin-top:0">Crée un compte pour sauvegarder tes données en ligne et les retrouver si tu changes de téléphone.</p>
    <div class="fields">
      <div class="field full"><label>E-mail</label><input id="accEmail" type="email" autocomplete="email" placeholder="toi@exemple.fr"></div>
      <div class="field full"><label>Mot de passe (6 caractères min.)</label><input id="accPw" type="password" autocomplete="current-password"></div>
    </div>
    ${S.authMsg?`<p class="tip" style="color:var(--ink);background:var(--yolk2);padding:8px 10px;border-radius:10px">${esc(S.authMsg)}</p>`:''}
    <div style="display:flex;gap:8px;margin-top:10px"><button class="btn small" data-act="login" ${S.authBusy?'disabled':''}>${S.authBusy?'…':'Se connecter'}</button><button class="btn ghost small" data-act="signup" ${S.authBusy?'disabled':''}>Créer un compte</button></div></div>`;
}

/* ---------- UI helpers ---------- */
function setStatus(s){S.status=s;const el=document.getElementById('status');if(el)el.textContent=s}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2000)}
async function copy(text){if(window.AndroidApp){try{AndroidApp.copy(text);toast('Copié !');return true}catch(e){}}try{await navigator.clipboard.writeText(text);toast('Copié !');return true}catch(e){return false}}
const eggSvg=`<svg viewBox="0 0 130 160"><defs><radialGradient id="g" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#FFFDF7"/><stop offset="1" stop-color="#F1DEC0"/></radialGradient></defs><path d="M65 6C34 6 10 58 10 96c0 33 25 58 55 58s55-25 55-58C120 58 96 6 65 6z" fill="url(#g)" stroke="#E2CDA8" stroke-width="2"/></svg>`;
function barChart(vals,labels,{h=130,hl=-1,fmtTop=null}={}){
  const W=340,pb=18,pt=16,max=Math.max(1,...vals.map(v=>v||0));const n=vals.length,bw=W/n;
  let s=`<svg viewBox="0 0 ${W} ${h}" width="100%" role="img" aria-label="Graphique">`;
  vals.forEach((v,i)=>{const bh=v==null?0:(v/max)*(h-pb-pt);const x=i*bw+bw*.15,w=bw*.7;
    s+=`<rect x="${x}" y="${h-pb-bh}" width="${w}" height="${Math.max(bh,v==null?0:1.5)}" rx="${Math.min(4,w/3)}" fill="${i===hl?'var(--yolk)':'var(--yolk2)'}"><title>${labels[i]} : ${v??'—'}</title></rect>`;
    if(fmtTop&&v)s+=`<text x="${x+w/2}" y="${h-pb-bh-4}" font-size="10" text-anchor="middle" fill="var(--mut)">${v}</text>`;
    if(labels[i]!=='')s+=`<text x="${x+w/2}" y="${h-4}" font-size="10" text-anchor="middle" fill="var(--mut)">${labels[i]}</text>`});
  return s+'</svg>';
}
function seg(name,opts,cur){return`<div class="seg">${opts.map(([v,l])=>`<button class="${v===cur?'on':''}" data-act="seg" data-k="${name}" data-v="${v}">${l}</button>`).join('')}</div>`}

/* ---------- vue Stats (mois / année) ---------- */
function vMois(){
  const k=S.vm,[y,m]=k.split('-').map(Number),st=monthStats(k),ps=monthStats(prevMonthKey(k));
  const nd=daysInMonth(k),M=S.months[k]||{days:{},depenses:[]};const t=today();
  const vals=[],lab=[];for(let i=1;i<=nd;i++){const x=(M.days||{})[pad(i)];vals.push(x?x.r:null);lab.push(i===1||i%5===0?String(i):'')}
  const diff=ps.tot?((st.tot-ps.tot)/ps.tot*100):null;
  const ly=monthStats((y-1)+'-'+pad(m)),dly=ly.n?((st.tot-ly.tot)/(ly.tot||1)*100):null;
  const first=(new Date(y,m-1,1).getDay()+6)%7;
  let cal='<div class="cal">'+['L','M','M','J','V','S','D'].map(h=>`<div class="h">${h}</div>`).join('');
  for(let i=0;i<first;i++)cal+='<div></div>';
  const max=Math.max(1,...vals.map(v=>v||0));
  for(let i=1;i<=nd;i++){const ds=k+'-'+pad(i),x=(M.days||{})[pad(i)],fut=ds>t;const a=x?.18+.82*(x.r/max):0;
    cal+=`<button class="c ${ds===t?'today':''} ${fut?'fut':''}" ${fut?'disabled':`data-act="goto" data-d="${ds}"`} style="${x?`background:color-mix(in srgb,var(--yolk) ${Math.round(a*100)}%,var(--bg))`:''}">${i}${x?`<b>${x.r}</b>`:''}</button>`}
  cal+='</div>';
  const nowK=t.slice(0,7),mag=S.settings.prixMagasin??0.35;
  const morts=flock().filter(a=>a.statut==='mort'&&a.fin&&a.fin.slice(0,7)===k).length;
  const arr=flock().filter(a=>a.arrivee&&a.arrivee.slice(0,7)===k).length;
  return `
  <div class="nav"><button class="ib" data-act="month" data-n="-1">‹</button>
    <div class="lbl">${MOIS[m-1]} ${y}<span class="sub">${st.n} jour${st.n>1?'s':''} saisi${st.n>1?'s':''} sur ${k===nowK?Number(t.slice(8)):nd}</span></div>
    <button class="ib" data-act="month" data-n="1" ${k>=nowK?'disabled':''}>›</button></div>
  <div class="kpis">
    <div class="kpi"><div class="v">${fmt(st.tot)}</div><div class="k">œufs récoltés</div>${diff!=null?`<div class="d ${diff>=0?'up':'down'}">${diff>=0?'▲':'▼'} ${fmt(Math.abs(diff))} % vs ${MOIS_C[(m+10)%12]}</div>`:''}${dly!=null&&ly.tot?`<div class="d ${dly>=0?'up':'down'}">${dly>=0?'▲':'▼'} ${fmt(Math.abs(dly))} % vs ${MOIS_C[m-1]} ${y-1}</div>`:''}</div>
    <div class="kpi"><div class="v">${fmt(st.avg,1)}</div><div class="k">moyenne / jour</div></div>
    <div class="kpi"><div class="v">${fmt(st.taux)} %</div><div class="k">taux de ponte (${fmt(st.poules,st.poules%1?1:0)} poules)</div></div>
    <div class="kpi"><div class="v">${st.best?st.best.r:'—'}</div><div class="k">${st.best?'record le '+Number(st.best.d)+' '+MOIS_C[m-1]:'meilleur jour'}</div></div>
  </div>
  <div class="card" style="margin-top:12px"><h2>Ponte jour par jour</h2>${barChart(vals,lab,{h:130})}</div>
  <div class="card"><h2>Calendrier</h2>${cal}<p class="tip" style="margin:8px 0 0">Touche un jour pour le modifier.</p></div>
  <div class="card"><h2>Bilan du mois</h2>
    <div class="row"><span>Œufs cassés / sales</span><b>${fmt(st.c)}</b></div>
    <div class="row"><span>Vendus / donnés</span><b>${fmt(st.v)}</b></div>

    <div class="row"><span>Recettes <span class="m">(${eur(S.settings.prix)}/œuf)</span></span><b>${eur(st.rev)}</b></div>

  </div>

    ${(M.depenses||[]).map((e,i)=>`<div class="row"><span>${esc(e.l)}</span><span><b>${eur(e.m)}</b> <button class="x" data-act="deldep" data-i="${i}" aria-label="Supprimer">×</button></span></div>`).join('')||'<p class="tip">Aucune dépense ce mois-ci.</p>'}
    <div class="fields" style="margin-top:10px">
      <div class="field"><label>Quoi</label><input id="depL" list="depList" placeholder="Aliment, paille…"><datalist id="depList"><option>Aliment / grain</option><option>Paille / copeaux</option><option>Coquilles / grit</option><option>Vétérinaire / vermifuge</option><option>Matériel</option></datalist></div>
      <div class="field"><label>Montant (€)</label><input id="depM" type="number" inputmode="decimal" step="0.01" placeholder="0,00"></div>
    </div>
    <button class="btn" style="margin-top:10px" data-act="adddep">Ajouter la dépense</button>
  </div>
  <button class="btn ghost" data-act="share">📋 Copier le récap du mois</button>
  <textarea class="out" id="shareOut" style="display:none" readonly></textarea>`;
}

function grabForm(){const E=S.edit;if(!E)return;const a=E.draft,g=id=>{const el=document.getElementById(id);return el?el.value:undefined};

function openAnimal(id){
  if(id){S.edit={mode:'edit',id,draft:clone(S.animals[id])}}

function commitAnimal(){
  grabForm();const E=S.edit,a=E.draft;
  if(a.ageArr==='')delete a.ageArr;
  if(a.statut==='vivant'){delete a.fin;delete a.cause}else if(!a.fin)a.fin=today();
  if(E.mode==='edit'){saveAnimal(a);S.edit=null;toast('Enregistré');render();return}
  const n=Math.max(1,Math.min(50,parseInt(E.n)||1)),prix=parseFloat(String(E.prix||'').replace(',','.'));
  const base=a.nom||'';const sameType=flock().filter(x=>x.type===a.type).length;
  for(let i=0;i<n;i++){const x=clone(a);x.id=uid();x.statut='vivant';

}

    </div>
    <div class="tl" style="margin-top:12px">${prev.map(m=>`<div class="tli"><span>${m.i}</span><div><b>J${m.j} · ${dShort(m.date)}</b><div class="m">${m.t}</div></div></div>`).join('')}</div>
    ${f.meth==='couveuse'?`<p class="tip">Couveuse : 37,7 °C, humidité 45–55 % puis 65–70 % les 3 derniers jours. Retourner les œufs 3 fois par jour jusqu’à J${ESP[f.esp].d-3}.</p>`:`<p class="tip">Poule couveuse : laisse-lui eau et nourriture à portée, et marque les œufs au crayon pour repérer ceux pondus en plus.</p>`}

  </div>
  ${done.length?`<div class="card"><h2>Historique</h2>${done.slice().reverse().map(c=>{const ok=Number(c.n)-Number(c.retires||0);return`<div class="row"><span>${ESP[c.esp].n} · ${dShort(c.debut)}<br><span class="m">${c.eclos||0} éclos / ${c.n} œufs${c.n?` · ${fmt((c.eclos||0)/c.n*100)} %`:''}</span></span><span>${!c.ajoutes&&c.eclos>0?`<button class="btn small" data-act="cvadd" data-id="${c.id}">+ ${c.eclos} 🐣</button>`:''}<button class="x" data-act="cvdel" data-id="${c.id}" aria-label="Supprimer">×</button></span></div>`}).join('')}</div>`:''}`;
}
function cvCard(c){
  const D=ESP[c.esp].d,j=diffDays(c.debut,today()),pct=Math.max(0,Math.min(100,j/D*100));
  const ms=milestones(c.esp,c.debut,c.meth);const next=ms.find(m=>m.j>=j);
  const fertiles=Number(c.n)-Number(c.retires||0);
  return`<div class="card cv"><div class="top2"><h2 style="margin:0">${ESP[c.esp].e||'🥚'} ${ESP[c.esp].n} · ${c.n} œufs</h2><button class="x" data-act="cvdel" data-id="${c.id}" aria-label="Supprimer">×</button></div>
  <div class="m" style="margin:2px 0 8px">${c.meth==='couveuse'?'Couveuse':'Poule couveuse'} · commencée le ${dShort(c.debut)}${window.AndroidApp&&AndroidApp.setCouveeAlerts&&couveeAlertsOn()?' · 🔔 alertes à 9 h':''}</div>
  <div class="prog"><div style="width:${pct}%"></div></div>
  <div class="top2" style="margin-top:6px"><b>${j<0?'Commence dans '+(-j)+' j':j>D+2?'Éclosion dépassée':'Jour '+j+' / '+D}</b><span class="m">${j<=D?'éclosion '+(D-j<=0?'aujourd’hui !':'dans '+(D-j)+' j'):''}</span></div>
  ${next&&next.j>0?`<div class="nextm">${next.i} ${next.j===j?'<b>Aujourd’hui</b>':'J'+next.j+' ('+dShort(next.date)+')'} : ${next.t}</div>`:''}
  <div class="tl">${ms.map(m=>`<div class="tli ${m.j<=j?'done':''}"><span>${m.j<=j?'✅':m.i}</span><div><b>J${m.j} · ${dShort(m.date)}</b><div class="m">${m.t}</div></div></div>`).join('')}</div>
  <div class="fields" style="margin-top:10px">
    <div class="field"><label>Œufs retirés au mirage</label><input type="number" inputmode="numeric" min="0" data-cv="${c.id}" data-f="retires" value="${c.retires||''}" placeholder="0"></div>
    <div class="field"><label>Poussins éclos</label><input type="number" inputmode="numeric" min="0" data-cv="${c.id}" data-f="eclos" value="${c.eclos||''}" placeholder="0"></div>
  </div>
  ${c.retires?`<p class="tip">${fertiles} œuf${fertiles>1?'s':''} encore en couvaison (${fmt(fertiles/c.n*100)} % fécondés).</p>`:''}
  ${j>=D-1?`<button class="btn" style="margin-top:10px" data-act="cvdone" data-id="${c.id}">Terminer la couvée</button>`:''}
  </div>`;
}

document.addEventListener('click',async e=>{
  const tab=e.target.closest('.tab');if(tab){S.edit=null;S.view=tab.dataset.view;if(S.view==='stats')S.vm=S.sel.slice(0,7);render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,n=Number(b.dataset.n);
  if(a==='day'){const s=addDays(S.sel,n);if(s<=today()){S.sel=s;render()}}
  else if(a==='inc'){const x=rec(S.sel);setDay(S.sel,{r:(x?x.r:0)+n})}
  else if(a==='setr'){setDay(S.sel,{r:n})}
  else if(a==='clear'){clearDay(S.sel);toast('Jour effacé')}
  else if(a==='seg'){const k=b.dataset.k,v=b.dataset.v;
    if(k==='f_type'){grabForm();S.edit.draft.type=v;render()}
    else if(k==='f_statut'){grabForm();S.edit.draft.statut=v;S.edit.confirmDel=false;render()}
    else{S[k]=v;render()}}
  else if(a==='month'){S.vm=n<0?prevMonthKey(S.vm):nextMonthKey(S.vm);render()}
  else if(a==='year'){S.vy+=n;render()}
  else if(a==='goto'){S.sel=b.dataset.d;S.view='jour';render();window.scrollTo(0,0)}
  else if(a==='gomonth'){S.vm=b.dataset.k;S.statsMode='mois';render();window.scrollTo(0,0)}
  else if(a==='adddep'){const l=document.getElementById('depL').value.trim(),m=parseFloat(String(document.getElementById('depM').value).replace(',','.'));
    if(!l||!(m>0)){toast('Indique quoi et combien');return}
    addDepense(S.vm+'-01',l,m);render();toast('Dépense ajoutée')}
  else if(a==='deldep'){const M=getMonth(S.vm);M.depenses.splice(Number(b.dataset.i),1);save('m-'+S.vm);render()}
  else if(a==='share'){const k=S.vm,[y,m]=k.split('-').map(Number),st=monthStats(k);
    const txt=`🐔 Récap ${MOIS[m-1]} ${y}\n🥚 ${st.tot} œufs récoltés (${fmt(st.avg,1)}/jour)\n📊 Taux de ponte : ${fmt(st.taux)} % (${fmt(st.poules,st.poules%1?1:0)} poules)\n🏆 Meilleur jour : ${st.best?st.best.r+' œufs le '+Number(st.best.d)+' '+MOIS[m-1]:'—'}\n💶 Vendus : ${st.v} (${eur(st.rev)}) · Dépenses : ${eur(st.dep)}`;
    if(!(await copy(txt))){const o=document.getElementById('shareOut');o.style.display='block';o.value=txt;o.select()}}
  else if(a==='newanimal'){openAnimal(null)}
  else if(a==='editanimal'){openAnimal(b.dataset.id)}
  else if(a==='closesheet'){S.edit=null;render()}
  else if(a==='delphoto'){grabForm();delete S.edit.draft.photo;render()}
  else if(a==='saveanimal'){commitAnimal()}
  else if(a==='delanimal'){grabForm();if(!S.edit.confirmDel){S.edit.confirmDel=true;render();return}
    const x=S.animals[S.edit.id];x.del=true;delete x.photo;saveAnimal(x);S.edit=null;toast('Fiche supprimée');render()}
  else if(a==='startcv'){const f=S.cvForm;const n=parseInt(document.getElementById('cv_n').value);if(!(n>0)){toast('Indique le nombre d’œufs');return}
    S.couvees.list=S.couvees.list||[];S.couvees.list.push({id:uid(),esp:f.esp,debut:f.debut||today(),n,meth:f.meth});saveCouvees();S.cvForm=null;toast('Couvée démarrée 🐣');render();window.scrollTo(0,0)}
  else if(a==='cvdel'){if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='Supprimer ?';b.style.fontSize='13px';return}
    S.couvees.list=S.couvees.list.filter(c=>c.id!==b.dataset.id);saveCouvees();render()}
  else if(a==='cvdone'){const c=S.couvees.list.find(c=>c.id===b.dataset.id);c.fini=true;saveCouvees();toast(`Couvée terminée : ${c.eclos||0} éclos`);render()}
  else if(a==='cvadd'){const c=S.couvees.list.find(c=>c.id===b.dataset.id);const hatch=addDays(c.debut,ESP[c.esp].d);const k=flock().filter(x=>x.type==='poussin').length;
    for(let i=0;i<Number(c.eclos);i++)saveAnimal({id:uid(),type:'poussin',statut:'vivant',nom:'Poussin '+(k+i+1),race:c.esp==='poule'?'':ESP[c.esp].n,naiss:hatch,notes:'Né de la couvée du '+dShort(c.debut)});
    c.ajoutes=true;saveCouvees();S.view='basse';S.flockFilter='vivants';toast(c.eclos+' poussins ajoutés');render();window.scrollTo(0,0)}
  else if(a==='csv'){let csv='date;recoltes;casses;vendus;note\n';Object.keys(S.months).sort().forEach(k=>{const days=S.months[k].days||{};Object.keys(days).sort().forEach(d=>{const x=days[d];csv+=`${k}-${d};${x.r||0};${x.c||0};${x.v||0};"${String(x.note||'').replace(/"/g,'""')}"\n`})});
    if(!(await copy(csv))){const o=document.getElementById('csvOut');o.style.display='block';o.value=csv;o.select()}}
  else if(a==='csvanimals'){const q=v=>'"'+String(v||'').replace(/"/g,'""')+'"';let csv='nom;type;race;naissance;arrivee;statut;date_fin;cause;notes\n';
    flock().forEach(x=>{csv+=[q(x.nom),x.type,q(x.race),birth(x)||'',x.arrivee||'',x.statut,x.fin||'',q(x.cause),q(x.notes)].join(';')+'\n'});
    if(!(await copy(csv))){const o=document.getElementById('csvOut');o.style.display='block';o.value=csv;o.select()}}
  else if(a==='testnotif'){try{AndroidApp.testNotif();toast('Notification envoyée')}catch(e){}}
  else if(a==='soindone'){soinDone(b.dataset.id)}
  else if(a==='soindel'){if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='Suppr. ?';b.style.fontSize='12px';return}S.soins.list=S.soins.list.filter(x=>x.id!==b.dataset.id);save('soins');render()}
  else if(a==='togglesoinform'){S.soinForm=!S.soinForm;render()}
  else if(a==='soinsdefaut'){S.soins.list=SOINS_CONSEILLES.map(([icon,nom,every])=>({id:uid(),icon,nom,every}));save('soins');toast('Soins ajoutés : indique quand tu les as faits');render()}
  else if(a==='soinadd'){const nom=document.getElementById('so_nom').value.trim(),every=parseInt(document.getElementById('so_every').value),last=document.getElementById('so_last').value;
    if(!nom||!(every>0)){toast('Indique quoi et tous les combien de jours');return}
    const known=SOINS_CONSEILLES.find(x=>x[1]===nom);S.soins.list=S.soins.list||[];S.soins.list.push({id:uid(),icon:known?known[0]:'✔️',nom,every,last:last||undefined});save('soins');S.soinForm=false;render()}
  else if(a==='backup'){const data={app:'mes-oeufs',v:1,date:today(),settings:S.settings,months:S.months,animals:S.animals,couvees:S.couvees,soins:S.soins};const txt=JSON.stringify(data);
    if(!(await copy(txt))){const o=document.getElementById('backupOut');o.style.display='block';o.value=txt;o.select()}}
  else if(a==='showrestore'){S.showRestore=!S.showRestore;render()}
  else if(a==='restore'){let d;try{d=JSON.parse(document.getElementById('restoreIn').value)}catch(e){toast('Texte de sauvegarde invalide');return}
    if(!d||d.app!=='mes-oeufs'){toast('Ce n’est pas une sauvegarde Mes œufs');return}
    if(d.settings)apply('reglages',d.settings);Object.entries(d.months||{}).forEach(([k,v])=>apply('m-'+k,v));Object.entries(d.animals||{}).forEach(([k,v])=>apply('a-'+k,v));
    if(d.couvees)apply('couvees',d.couvees);if(d.soins)apply('soins',d.soins);
    ['reglages','couvees','soins',...Object.keys(S.months).map(k=>'m-'+k),...Object.keys(S.animals).map(k=>'a-'+k)].forEach(id=>{if(docData(id))save(id)});
    S.showRestore=false;toast('Données restaurées ✓');render()}
  else if(a==='login'||a==='signup'){login(document.getElementById('accEmail').value.trim(),document.getElementById('accPw').value,a==='signup')}
  else if(a==='logout'){logout();toast('Déconnecté')}
  else if(a==='syncnow'){await syncAll();toast('Synchronisé')}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='r'||id==='c'||id==='v'){if(e.target.value==='')return;setDay(S.sel,{[id]:e.target.value},false)}
  else if(id==='note'){setDay(S.sel,{note:e.target.value.slice(0,500)},false)}
  else if(id==='sPoules'||id==='sPrix'||id==='sMag'){const v=parseFloat(String(e.target.value).replace(',','.'));if(isNaN(v)||v<0)return;
    S.settings[{sPoules:'poules',sPrix:'prix',sMag:'prixMagasin'}[id]]=id==='sPoules'?Math.round(v):v;save('reglages')}
});
document.addEventListener('change',async e=>{
  const t=e.target,id=t.id;
  if(['r','c','v'].includes(id)){if(t.value==='')setDay(S.sel,{[id]:0});else render()}
  else if(id==='f_photo'&&t.files&&t.files[0]){try{grabForm();S.edit.draft.photo=await readPhoto(t.files[0]);render()}catch(err){toast('Photo illisible')}}
  else if(id==='f_naiss'||id==='f_arr'||id==='f_agearr'||id==='f_fin'){grabForm();const a=S.edit.draft,bx=document.querySelector('.sheet .agebox');if(bx){const bb=birth(a);bx.innerHTML=`Âge : <b>${ageStr(bb,a.statut!=='vivant'&&a.fin?a.fin:today())}</b>${bb?` <span class="m">(né·e vers le ${dLong(bb)})</span>`:''}`}}
  else if(id==='cv_n'){S.cvForm.n=t.value}
  else if(id==='cvAl'){S.settings.alertesCouvee=t.checked;save('reglages');syncCouveeAlerts();toast(t.checked?'Alertes de couvée activées':'Alertes de couvée désactivées')}
  else if(id==='rapOn'||id==='rapT'){const on=document.getElementById('rapOn').checked,t=document.getElementById('rapT').value||'19:00';
    S.settings.rappel={on,t};save('reglages');const[h,m]=t.split(':').map(Number);try{AndroidApp.setReminder(on,h,m)}catch(e){}toast(on?'Rappel tous les jours à '+t.replace(':','h'):'Rappel désactivé')}
  else if(id&&id.startsWith('cv_')){const f=S.cvForm;f[id.slice(3)]=t.value;render()}
  else if(t.dataset.cv){const c=S.couvees.list.find(c=>c.id===t.dataset.cv);if(!c)return;c[t.dataset.f]=Math.max(0,parseInt(t.value)||0);saveCouvees();setTimeout(()=>{const a=document.activeElement;if(!(a&&a.tagName==='INPUT'))render()},250)}
});
document.addEventListener('focusin',e=>{if(e.target.type==='number')setTimeout(()=>{try{e.target.select()}catch(_){}} ,0)});
window.addEventListener('popstate',()=>{});
startSync();
try{const r=S.settings.rappel;if(r&&r.on&&window.AndroidApp&&AndroidApp.setReminder){const[h,m]=r.t.split(':').map(Number);AndroidApp.setReminder(true,h,m)}}catch(e){}
syncCouveeAlerts();
</script>
</body>
</html>
